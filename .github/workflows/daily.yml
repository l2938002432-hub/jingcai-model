name: Daily Sporttery Feed
on:
  schedule:
    - cron: "20 * * * *" # hourly; sends only fresh candidates at T-120 to T-60
  workflow_dispatch:
    inputs:
      snapshot_gzip_base64:
        description: "Optional gzip+base64 official snapshot (max 60000 chars)"
        required: false
        type: string
      snapshot_sha256:
        description: "Required SHA-256 of expanded canonical JSON when snapshot is supplied"
        required: false
        type: string
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: daily-sporttery
  cancel-in-progress: false
jobs:
  fetch-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare run date
        id: run-date
        shell: bash
        run: echo "date=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore notification idempotency state
        uses: actions/cache@v4
        with:
          path: artifacts/daily/.notification-dedupe.json
          key: daily-notification-${{ steps.run-date.outputs.date }}-${{ github.run_id }}
          restore-keys: |
            daily-notification-${{ steps.run-date.outputs.date }}-
      - name: Restore today's relayed official snapshot
        uses: actions/cache@v4
        with:
          path: data/snapshots/relay.json
          key: official-snapshot-${{ steps.run-date.outputs.date }}-${{ github.run_id }}
          restore-keys: |
            official-snapshot-${{ steps.run-date.outputs.date }}-
      - name: Download free historical inputs
        shell: bash
        run: |
          mkdir -p data/raw/football-data data/raw/club-history data/raw/uefa
          curl --fail --location --retry 3 --silent --show-error \
            https://www.football-data.co.uk/mmz4281/2526/E0.csv \
            --output data/raw/football-data/E0_2025-26.csv
          curl --fail --location --retry 3 --silent --show-error \
            https://raw.githubusercontent.com/xgabora/Club-Football-Match-Data-2000-2025/main/data/Matches.csv \
            --output data/raw/club-history/Matches.csv
          curl --fail --location --retry 3 --silent --show-error \
            https://raw.githubusercontent.com/xgabora/Club-Football-Match-Data-2000-2025/main/data/EloRatings.csv \
            --output data/raw/club-history/EloRatings.csv
          for year in $(seq 2017 2025); do
            curl --fail --location --retry 3 --silent --show-error \
              "https://match.uefa.com/v5/matches?competitionId=1&seasonYear=${year}&limit=500&offset=0&order=ASC" \
              --output "data/raw/uefa/ucl-${year}.json"
          done
      - name: Validate relayed official snapshot
        if: ${{ inputs.snapshot_gzip_base64 != '' }}
        env:
          SPORTTERY_SNAPSHOT_GZIP_BASE64: ${{ inputs.snapshot_gzip_base64 }}
          SPORTTERY_SNAPSHOT_SHA256: ${{ inputs.snapshot_sha256 }}
          SPORTTERY_SNAPSHOT_OUTPUT: data/snapshots/relay.json
          PYTHONPATH: src
        run: python scripts/decode_relay_snapshot.py
      - name: Fetch, archive and notify
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUBLIC_REPORT_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        shell: bash
        run: |
          snapshot_args=()
          if [ -f data/snapshots/relay.json ]; then
            snapshot_args=(--snapshot-json data/snapshots/relay.json)
          fi
          for attempt in 1 2 3; do
            if python scripts/daily_cloud_run.py --output-dir artifacts/daily "${snapshot_args[@]}"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done
          exit 1
      - name: Resolve generated report metadata
        id: report
        shell: bash
        run: |
          report_json="$(find artifacts/daily -maxdepth 1 -type f -name 'report-*.json' -print -quit)"
          if [ -z "$report_json" ]; then
            echo "No generated report metadata found" >&2
            exit 1
          fi
          report_html="$(python -c 'import json,sys,pathlib; p=pathlib.Path(sys.argv[1]); d=json.loads(p.read_text(encoding="utf-8")); print(p.parent / d["html"])' "$report_json")"
          test -f "$report_html"
          release_id="$(python -c 'import json,sys,pathlib; print(json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))["release_id"])' "$report_json")"
          echo "json=$report_json" >> "$GITHUB_OUTPUT"
          echo "html=$report_html" >> "$GITHUB_OUTPUT"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
      - name: Restore public report history
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --exit-code --heads origin pages-history >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch pages-history \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" artifacts/site
          else
            mkdir -p artifacts/site
            git -C artifacts/site init --quiet
            git -C artifacts/site checkout --orphan pages-history
            git -C artifacts/site remote add origin \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi
      - name: Build public report site
        shell: bash
        run: |
          python scripts/build_public_site.py \
            --html "${{ steps.report.outputs.html }}" \
            --json "${{ steps.report.outputs.json }}" \
            --output-dir artifacts/site \
            --release-id "${{ steps.report.outputs.release_id }}"
      - name: Persist sanitized public history
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -C artifacts/site config user.name "github-actions[bot]"
          git -C artifacts/site config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C artifacts/site add index.html report.json reports
          if ! git -C artifacts/site diff --cached --quiet; then
            git -C artifacts/site commit --quiet -m "Publish report ${{ steps.report.outputs.release_id }}"
          fi
          git -C artifacts/site push origin pages-history
          rm -rf artifacts/site/.git
      - name: Upload audit snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sporttery-${{ github.run_id }}
          path: artifacts/daily
          if-no-files-found: warn
          retention-days: 30
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload report site
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/site
      - name: Publish report site
        id: deployment
        uses: actions/deploy-pages@v4
