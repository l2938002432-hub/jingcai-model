name: Daily Sporttery Feed
on:
  schedule:
    - cron: "25 2 * * *" # 10:25 Asia/Shanghai
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daily-sporttery
  cancel-in-progress: false
jobs:
  fetch-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch, archive and notify
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
        run: python scripts/daily_cloud_run.py --output-dir artifacts/daily
      - name: Upload audit snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sporttery-${{ github.run_id }}
          path: artifacts/daily
          if-no-files-found: warn
          retention-days: 30
